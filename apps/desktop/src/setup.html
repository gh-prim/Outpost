<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Outpost</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #09090b; color: #fafafa; font: 14px system-ui, sans-serif; }
      form { width: 360px; padding: 32px; border: 1px solid #27272a; border-radius: 8px; background: #0f0f12; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p { margin: 0 0 20px; color: #a1a1aa; }
      input { box-sizing: border-box; width: 100%; height: 36px; padding: 0 10px; border: 1px solid #3f3f46; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
      button { width: 100%; height: 36px; margin-top: 12px; border: 0; border-radius: 6px; background: #6366f1; color: white; font: inherit; font-weight: 500; cursor: pointer; }
      button:disabled { opacity: 0.6; }
      .error { margin-top: 12px; color: #f87171; }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>Outpost</h1>
      <p>Enter the address of your company's Outpost server.</p>
      <input id="url" placeholder="outpost.company.com" autofocus required />
      <button id="submit" type="submit">Connect</button>
      <div id="error" class="error"></div>
    </form>
    <script>
      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("submit");
        const error = document.getElementById("error");
        button.disabled = true;
        error.textContent = "";
        try {
          await window.outpostSetup.setServer(document.getElementById("url").value);
        } catch (e) {
          error.textContent = String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, "");
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
